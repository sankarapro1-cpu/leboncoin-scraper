version: "3.9"

services:
  app:
    build: .
    container_name: autodeal
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data        # Persistance base de données SQLite
      - ./.env:/app/.env:ro     # Configuration
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/stats"]
      interval: 30s
      timeout: 10s
      retries: 3

